name: CI and security gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIGRATIONLENS_LLM_BACKEND: fake
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: Python 3.11 offline verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install declared project and development dependencies
        run: python -m pip install ".[dev]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run offline FakeLLM test suite
        run: python -m pytest -q

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Validate Compose configuration only
        run: docker compose config --quiet

      - name: Audit declared Python dependencies for known vulnerabilities
        run: python -m pip_audit . --strict

      - name: Download checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan complete Git history for secrets
        run: ./gitleaks git . --redact --no-banner --exit-code 1 --log-opts="--all"
