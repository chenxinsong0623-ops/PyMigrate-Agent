[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymigrate-agent"
version = "0.1.0"
description = "MigrationLens：Pydantic v1→v2 升级影响分析 Agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.11",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "qdrant-client==1.18.0",
    "sentence-transformers==5.6.1",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
    "locust==2.46.4",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".idea", "data/snapshots", "app/evaluation/locked.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
