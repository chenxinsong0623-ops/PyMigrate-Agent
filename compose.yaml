services:
  qdrant:
    image: qdrant/qdrant:v1.18.3-unprivileged
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for table in /proc/net/tcp /proc/net/tcp6; do
            while read -r slot local_address remote_address state rest; do
              case "$${local_address}:$${state}" in *:18BD:0A) exit 0;; esac;
            done < "$${table}";
          done;
          exit 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MIGRATIONLENS_ENVIRONMENT: development
      MIGRATIONLENS_SQLITE_PATH: /app/var/data/migrationlens.sqlite3
      MIGRATIONLENS_QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/var
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  api_data:
  qdrant_data:
